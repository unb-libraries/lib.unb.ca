name: Deploy lib.unb.ca
on:
  push:
    branches: [dev, prod, new_front_page]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    uses: unb-libraries/github-workflows/.github/workflows/build-push-deploy-notify.yaml@1.x
    with:
      branch-env-map: '{"dev":"dev","prod":"prod","new_front_page":"newfront"}'
      build-themes: true
      check-logs: true
      log-check-profile: 'drupal'
      deploy-branches: '["dev","prod","new_front_page"]'
      image-name: 'ghcr.io/unb-libraries/lib.unb.ca'
      k8s-deployment-name: 'lib-unb-ca'
      platforms: 'linux/amd64'
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
