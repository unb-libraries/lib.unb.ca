id: oer_support_request
title: 'Open Educational Resources (OER) Request'
description: 'Webform that allows instructors to ask for support with OER,'
category: ''
elements: |-
  note:
    '#type': processed_text
    '#text': |
      <div class="card border-dark mb-4">
      <div class="card-body text-muted-wcag p-0 mb-3">
      <h2 class="card-title h6 bg-dark text-white p-2">Before you submit</h2>

      <p class="alert alert-light card-text">Thank you for your interest in an OER collaboration. Before submitting this form, please review the <a href="/publishing/about-open-educational-resources">information on our Website</a>, and outline for <a href="/publishing/oer-collaborations">collaboration</a>.</p>
      </div>
      </div>
    '#format': library_page_html
  container:
    '#type': container
    '#attributes':
      class:
        - theme-dark
    personal_information:
      '#type': fieldset
      '#title': 'Personal information'
      name:
        '#type': textfield
        '#title': Name
        '#required': true
        '#default_value': '[current-user:field_first_name] [current-user:field_last_name]'
      faculty_discipline:
        '#type': textfield
        '#title': Faculty
        '#required': true
      email:
        '#type': textfield
        '#title': Email
        '#input_mask': '''alias'': ''email'''
        '#required': true
        '#pattern': '^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$'
        '#default_value': '[current-user:mail]'
      home_campus:
        '#type': radios
        '#title': 'Home campus'
        '#options':
          fredericton: Fredericton
          saint_john: 'Saint John'
          moncton: Moncton
        '#options_display': side_by_side
    project_information:
      '#type': fieldset
      '#title': 'Project Information'
      looking_for_support:
        '#type': checkboxes
        '#title': 'I am looking for support'
        '#options':
          finding_oer: 'Finding OER'
          adapting_existing_oer: 'Adapting an Existing OER'
          creating_own_oer: 'Creating my own OER'
          unsure: Unsure
      conducted_initial_search:
        '#type': radios
        '#title': 'Have you conducted an initial search for relevant OER on the subject?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': side_by_side
        '#required': true
      for_credit_course_unb:
        '#type': radios
        '#title': 'Would this OER support a for-credit course at UNB?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': side_by_side
        '#required': true
      course_looking_oer_content:
        '#type': textfield
        '#title': 'What course(s) are you looking for OER content?'
        '#states':
          visible-slide:
            ':input[name="for_credit_course_unb"]':
              value: 'yes'
      semester_course_offered:
        '#type': checkboxes
        '#title': 'What semester(s) is your course offered in?'
        '#options':
          f: Fall
          w: Winter
          s: Summer
        '#options_display': side_by_side
        '#required': true
      how_many_students:
        '#type': textfield
        '#title': 'How many students are enrolled in this course?'
      oer_replace_paid_textbook:
        '#type': radios
        '#title': 'Would this OER replace a paid textbook?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': side_by_side
      current_course_looking_replace:
        '#type': textfield
        '#title': 'What is the current course material you are looking to replace?'
        '#states':
          visible-slide:
            ':input[name="oer_replace_paid_textbook"]':
              value: 'yes'
      syllabus_upload:
        '#type': webform_document_file
        '#title': 'Please upload the course(s) syllabus you are seeking OER material for. This will help us get an understanding of the class as a whole'
        '#sanitize': true
        '#button': true
        '#button__title': 'Select file<span class="fa-solid fa-paperclip ml-1"></span>'
        '#button__attributes':
          class:
            - btn
            - btn-light
            - border-secondary
      brief_project_description:
        '#type': textarea
        '#title': 'Provide a brief project description'
        '#required': true
