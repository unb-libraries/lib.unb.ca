id: oer_support_request
title: 'OER Support Request'
description: 'Webform that allows instructors to ask for support with OER,'
category: ''
elements: |-
  note:
    '#type': processed_text
    '#text': |
      <div class="card border-dark mb-4">
      <div class="card-body text-muted-wcag p-0 mb-3">
      <h2 class="card-title h6 bg-dark text-white p-2">Before you submit</h2>

      <div class="p-2">
      <p class="card-text"><span></span>Thank you for your interest in an OER collaboration. Before submitting this form, please review the information on our Website [link], and outline for collaboration [link].<br />
      &nbsp;</p>
      </div>
      </div>
      </div>
    '#format': library_page_html
  container:
    '#type': container
    '#attributes':
      class:
        - theme-dark
    personal_information:
      '#type': fieldset
      '#title': 'Personal information'
      name:
        '#type': textfield
        '#title': Name
        '#required': true
      faculty_discipline:
        '#type': textfield
        '#title': Faculty
        '#required': true
      email:
        '#type': textfield
        '#title': Email
        '#input_mask': '''alias'': ''email'''
        '#required': true
        '#pattern': '^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$'
      home_campus:
        '#type': radios
        '#title': 'Home campus'
        '#options':
          fredericton: Fredericton
          saint_john: 'Saint John'
          moncton: Moncton
        '#options_display': side_by_side
    project_information:
      '#type': fieldset
      '#title': 'Project Information'
      i_am_looking_for_support_select_one_:
        '#type': checkboxes
        '#title': 'I am looking for support [select one]'
        '#options':
          finding_oer: 'Finding OER'
          adapting_existing_oer: 'Adapting an Existing OER'
          creating_own_oer: 'Creating my own OER'
          unsure: Unsure
        '#required': true
