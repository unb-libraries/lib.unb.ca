id: library_instruction_session
title: 'Request a Library Instruction Session'
description: 'Clone NC State&#39;s&nbsp;<em>Request a Library Instruction Session</em> webform'
category: ''
elements: |-
  basic_details:
    '#type': webform_wizard_page
    '#title': 'Basic Details'
    '#format_attributes':
      class:
        - d-flex
    '#access_create_roles':
      - authenticated
    '#next_button_label': 'Continue ›'
    about_request:
      '#type': webform_markup
      '#wrapper_attributes':
        class:
          - my-5
      '#markup': |-
        <div class="alert alert-light border border-dark mb-5">
        <p class="m-0"><strong>Are you a student seeking research support? Please visit our <a href="/guides/view-all">Research Guides</a> , <a href="/connect">Get Specialized Help</a> , or <a href="/help/ask-us">Ask Us</a> pages.</strong></p>
        </div>

        <h2>About placing a request</h2>

        <p>Thank you for taking the time to complete this form, which will help our subject librarians and Library Instruction team develop resources and sessions that suit your learners&rsquo; needs. After we receive your request, we&#39;ll be in touch with you by email. If you have questions, please <a href="/contact-unb-libraries-staff?recipient=hanratty&amp;subject=Library%20Instruction%20Request">contact us<span class="fa-solid fa-link fa-xs ml-1"></span></a>.</p>
    instruction_type_request:
      '#type': radios
      '#title': 'Which type of instruction would you like to request?'
      '#options':
        discipline_specific: 'Discipline-Specific Research Instruction -- Our Subject Librarians customize sessions to align with your course objectives, showcasing the most relevant databases, tools, and research strategies to empower your students in tackling research assignments effectively.'
        special_collections: 'Special Collections Instruction -- We can help your students get excited about hands-on research using original materials, become familiar with viewing and using primary sources, get to know the range of materials in our Special Collections holdings.'
        digital_media: 'Digital Media Instruction -- Inspire students and enhance digital literacy and multimedia storytelling skills through podcast, video, and other media making assignments with planning, technology, and Libraries studio spaces support.'
        other: Workshop/Other
      '#required': true
  course_information:
    '#type': webform_wizard_page
    '#title': 'Course Information'
    '#format': fieldset
    '#prev_button_label': '‹ Previous'
    '#next_button_label': 'Complete ›'
    fieldset:
      '#type': fieldset
      '#title': 'Course Information Details'
      '#title_display': invisible
      summary_so_far:
        '#type': webform_markup
        '#markup': |-
          <aside class="text-center">
          <div class="card bg-light d-inline-block w-75">
          <div class="card-header h4">Summary so far</div>

          <div class="card-body">
          <p class="card-text">Selected instruction type: <kbd class="bg-light text-unb-red">[webform_submission:values:instruction_type_request]</kbd></p>
          </div>
          </div>
          </aside>
      your_name:
        '#type': webform_name
        '#title': 'Your name'
        '#required': true
        '#title__access': false
        '#first__title': Name
        '#first__required': true
        '#middle__access': false
        '#last__access': false
        '#last__title': 'Last name'
        '#suffix__access': false
        '#degree__access': false
        '#flexbox': '1'
      unb_email_address:
        '#type': email
        '#title': 'UNB Email Address'
        '#autocomplete': email
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      course_no:
        '#type': textfield
        '#title': 'Course Number'
        '#description': 'Example: BIOL*1001, KIN*3041, MBA Orientation'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      section_information:
        '#type': webform_custom_composite
        '#title': Section
        '#required': true
        '#multiple__sorting': false
        '#multiple__add': false
        '#multiple__add_more_input': false
        '#multiple__add_more_button_label': '⊕ Add another section'
        '#wrapper_attributes':
          class:
            - mb-5
        '#element':
          number_students:
            '#type': textfield
            '#title': 'No. of students'
          course_time:
            '#type': textfield
            '#required': true
            '#title': 'Course time'
            '#description': 'Example: MWF 10-11am'
          date_first:
            '#type': date
            '#required': true
            '#title': 'Date: 1st choice'
            '#description': 'Please allow at least 5 days’ notice'
            '#date_date_min': '+1 day'
          date_second:
            '#type': date
            '#title': 'Date: 2nd choice'
            '#description': 'Please allow at least 5 days’ notice'
            '#date_date_min': '+2 day'
          date_third:
            '#type': date
            '#title': 'Date: 3rd choice'
            '#description': 'Please allow at least 5 days’ notice'
            '#date_date_min': '+1 day'
      goals_for_this_session_:
        '#type': textarea
        '#title': 'What are your goals for this session?'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      students_require_accommodations:
        '#type': radios
        '#title': 'Do you have any students who require special accommodations that pertain to this request?'
        '#options':
          'yes': 'Yes -- Please provide details below.'
          no_unsure: 'No / Not sure -- If you learn of an accommodation need, you can contact us after we have received your initial request.'
        '#options_display': two_columns
        '#attributes':
          class:
            - mb-5
      accommodations_details:
        '#type': textarea
        '#title': 'Accommodations Details'
        '#states':
          visible-slide:
            ':input[name="students_require_accommodations"]':
              value: 'yes'
        '#attributes':
          class:
            - mb-5
      would_you_like_us_to_teach_to_a_specific_assignment:
        '#type': radios
        '#title': 'Would you like us to teach to a specific assignment?'
        '#options':
          'yes': 'Yes -- If yes, please describe below'
          'no': 'No'
        '#options_display': two_columns
        '#required': true
        '#attributes':
          class:
            - mb-5
      about_assignment:
        '#type': textarea
        '#title': 'Assignment Information'
        '#description': 'Briefly describe the assignment, instead of or in addition to uploading it. Tell us where in the assignment process your students will be at the time of the session: whether they have been introduced to the assignment, have chosen topics, or begun researching.'
        '#states':
          visible-slide:
            ':input[name="would_you_like_us_to_teach_to_a_specific_assignment"]':
              value: 'yes'
        '#wrapper_attributes':
          class:
            - mb-5
      would_you_like_help_creating_a_digital_or_information_literacy_a:
        '#type': radios
        '#title': 'Would you like help creating a digital or information literacy assignment?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': two_columns
        '#attributes':
          class:
            - mb-5
      information_d2l:
        '#type': radios
        '#title': 'Would you like to like any information about the self-paced D2L course, <a href="https://lms.unb.ca/d2l/home/147329">UNB Libraries’ Research Toolkit <i class="fa-solid fa-arrow-up-right-from-square fa-xs mr-1"></i></a>?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': two_columns
        '#attributes':
          class:
            - mb-5
      campus:
        '#type': radios
        '#title': Campus
        '#options':
          unbf: UNBF
          unbsj: UNBSJ
        '#options_display': two_columns
        '#required': true
        '#attributes':
          class:
            - mb-5
      location:
        '#type': radios
        '#title': 'Location of Session'
        '#options':
          hil: 'Harriet Irving Library'
          classroom: Classroom/lab
          online: Online
        '#options_display': three_columns
        '#required': true
      hil_rooms:
        '#type': select
        '#title': 'Room <small class="font-weight-light text-unb-red">(required)</small>'
        '#options':
          hil100: 'HIL 100 – Milham Room'
          hil109: 'HIL 109 Lamsoq Polam'
          hil112: 'HIL 112 – Learning Lab'
          hil303: 'HIL 303 – Research Commons Active Learning Lab'
          hil310: 'HIL 310 Research Commons Fabrication Lab'
          hil316: 'HIL 316 – Research Commons Innovation Hub'
          hil318: 'HIL 318 – Research Commons Event Space'
          hil320a: 'HIL 320A – Research Commons Film Maker Studio'
          hil320d: 'HIL 320D – Data Visualization Lab'
          hil413: 'HIL 413 – Nan Gregg Room (CLC Collection)'
          hil417: 'HIL 417 – Data/GIS Lab'
          other: Other
        '#chosen': true
        '#states':
          visible-slide:
            ':input[name="location"]':
              value: hil
          required:
            ':input[name="location"]':
              value: hil
        '#attributes':
          class:
            - w-100
      building_room_number:
        '#type': textfield
        '#title': 'Building, Room Number <small class="font-weight-light text-unb-red">(required)</small>'
        '#states':
          visible-slide:
            ':input[name="location"]':
              value: classroom
          required:
            ':input[name="location"]':
              value: classroom
      additional_comments:
        '#type': textarea
        '#title': 'Any additional comments?'
        '#wrapper_attributes':
          class:
            - my-5
      upload_doc:
        '#type': webform_document_file
        '#title': 'Upload your syllabus and/or assignment description'
        '#multiple': 2
        '#max_filesize': '32'
        '#file_extensions': 'pdf doc docx'
        '#sanitize': true
        '#button': true
        '#button__title': 'Select file<span class="fa-solid fa-paperclip ml-1"></span>'
        '#button__attributes':
          class:
            - btn
            - btn-light
            - border-secondary
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
    '#submit__attributes':
      class:
        - mx-1
        - px-3
