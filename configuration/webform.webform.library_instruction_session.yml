id: library_instruction_session
title: 'Request a Library Instruction Session'
description: 'Clone NC State&#39;s&nbsp;<em>Request a Library Instruction Session</em> webform'
category: ''
elements: |-
  basic_details:
    '#type': webform_wizard_page
    '#title': 'Basic Details'
    '#format_attributes':
      class:
        - d-flex
    '#access_create_roles':
      - authenticated
    '#next_button_label': 'Course Information ›'
    about_request:
      '#type': webform_markup
      '#wrapper_attributes':
        class:
          - my-5
      '#markup': |-
        <h2>About placing a request</h2>

        <p>Instructors can use this form to request a library instruction session for their class. After we receive your request, we'll be in touch with you shortly by email. If you have questions, please email us at&nbsp;<a href="mailto:library_instruction@unb.ca">library_instruction@unb.ca</a>.</p>

        <div class="alert alert-light border">
        <p class="m-0"><strong>Are you a student seeking help from a librarian? </strong><a href="/researchconsultation">Request a Research Consultation</a> or a <a href="/digital-media-lab/techconsult">Technology Consultation</a>.</p>
        </div>
    instruction_type_request:
      '#type': radios
      '#title': 'Which type of instruction would you like to request?'
      '#options':
        writing_speaking: 'Library Instruction for Writing and Speaking Classes -- For courses in the First Year Writing Program, Intro to Public Speaking, and other related courses.'
        discipline_specific: 'Discipline-Specific Research Instruction -- Subject Specialist Librarians will tailor instruction to fit the learning objectives of your course. We will highlight the databases, resources, and research methods that are most relevant to your discipline and will help your students succeed in their research assignments.'
        special_collections: 'Special Collections Instruction -- We can help your students get excited about hands-on research using original materials, become familiar with viewing and using primary sources, get to know the range of materials in our Special Collections holdings, and learn about the evolution of their college or discipline at UNB.'
        data_visualization: 'Data & Visualization Instruction -- Get hands-on instruction support for your students on making effective data visualizations, data cleaning and analysis, and mapping with GIS.'
        makerspace: 'Makerspace or Virtual Reality Instruction -- Engage your students with the tools and technologies of the maker movement and virtual reality to spur creativity, problem solving skills, and critical thinking.'
        digital_media: 'Digital Media Instruction -- Inspire students and enhance digital literacy and multimedia storytelling skills through podcast, video, and other media making assignments with planning, technology, and Libraries studio spaces support.'
        other: Other
      '#required': true
  course_information:
    '#type': webform_wizard_page
    '#title': 'Course Information'
    '#format': fieldset
    '#prev_button_label': '‹ Basic Details'
    '#next_button_label': 'Complete ›'
    fieldset:
      '#type': fieldset
      '#title': 'Course Information Section'
      '#title_display': invisible
      summary_so_far:
        '#type': webform_markup
        '#markup': |-
          <strong>Summary so far</strong>
          <div class="alert alert-info mt-2"><strong>Instruction type:</strong> [webform_submission:values:instruction_type_request]</div>
      your_name:
        '#type': webform_name
        '#title': 'Your name'
        '#required': true
        '#title__access': false
        '#first__title': 'First name'
        '#first__required': true
        '#middle__access': false
        '#last__title': 'Last name'
        '#last__required': true
        '#suffix__access': false
        '#degree__access': false
        '#flexbox': '1'
      your_email_address:
        '#type': email
        '#title': 'Your email address'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      course_id:
        '#type': textfield
        '#title': 'Course ID'
        '#description': 'Example: ENG 333'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      section_information:
        '#type': webform_custom_composite
        '#title': 'Section information'
        '#required': true
        '#multiple__sorting': false
        '#multiple__add': false
        '#multiple__add_more_input': false
        '#multiple__add_more_button_label': '⊕ Add another section'
        '#wrapper_attributes':
          class:
            - mb-5
        '#element':
          course_section:
            '#type': textfield
            '#required': true
            '#title': 'Course section'
            '#description': |
              Example: 001
          number_students:
            '#type': textfield
            '#title': 'Number of students'
          course_time:
            '#type': textfield
            '#required': true
            '#title': 'Course time'
            '#description': 'Example: MWF 10-11am'
          date_first:
            '#type': date
            '#required': true
            '#title': 'Date: 1st choice'
            '#description': 'Must be at least 10 days in advance'
            '#date_date_min': '+10 days'
          date_second:
            '#type': date
            '#title': 'Date: 2nd choice'
            '#description': 'Must be at least 10 days in advance'
            '#date_date_min': '+10 days'
          date_third:
            '#type': date
            '#title': 'Date: 3rd choice'
            '#description': |-
              Must be at least 10 days in advance

              dd/mm/yyyy
            '#date_date_min': '+10 days'
      goals_for_this_session_:
        '#type': textarea
        '#title': 'What are your goals for this session?'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      students_require_accommodations:
        '#type': radios
        '#title': 'Do you have any students who require special accommodations?'
        '#options':
          'yes': 'Yes -- A library staff member will reach out to you after you submit this form to discuss details.'
          no_unsure: 'No / Not sure -- If you learn of an accommodation need, you can reach out to the library staff member who will be working with your class.'
        '#required': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
