id: library_instruction_session
title: 'Request a Library Instruction Session'
description: 'Clone NC State&#39;s&nbsp;<em>Request a Library Instruction Session</em> webform'
category: ''
elements: |-
  basic_details:
    '#type': webform_wizard_page
    '#title': 'Basic Details'
    '#format_attributes':
      class:
        - d-flex
    '#access_create_roles':
      - authenticated
    '#next_button_label': 'Course Information ›'
    about_request:
      '#type': webform_markup
      '#wrapper_attributes':
        class:
          - my-5
      '#markup': |-
        <h2>About placing a request</h2>

        <p>Thank you for taking the time to complete this form, which will help our subject librarians and Library Instruction team develop resources and sessions that suit your learners&rsquo; needs. After we receive your request, we&#39;ll be in touch with you by email. If you have questions, please <a href="/contact-unb-libraries-staff?recipient=hanratty?&amp;ubject=Library%20Instruction%20Request">contact us</a> <span class="fa-solid fa-arrow-up-right-from-square fa-xs text-muted" aria-hidden="true"></span>.</p>

        <div class="alert alert-light border border-dark">
        <p class="m-0">
          <span class="fas fa-circle-info text-info fa-lg" aria-hidden="true"></span>
          <strong>Are you a student seeking research support? Please visit our <a href="/guides/view-all">Research Guides</a> <span class="fa-solid fa-arrow-up-right-from-square fa-xs text-muted" aria-hidden="true"></span>, <a href="/connect">Get Specialized Help</a> <span class="fa-solid fa-arrow-up-right-from-square fa-xs text-muted" aria-hidden="true"></span>, or <a href="/help/ask-us">Ask Us</a> <span class="fa-solid fa-arrow-up-right-from-square fa-xs text-muted" aria-hidden="true"></span> pages.</strong></p>
        </div>
    instruction_type_request:
      '#type': radios
      '#title': 'Which type of instruction would you like to request?'
      '#options':
        discipline_specific: 'Discipline-Specific Research Instruction -- Our Subject Librarians customize sessions to align with your course objectives, showcasing the most relevant databases, tools, and research strategies to empower your students in tackling research assignments effectively.'
        special_collections: 'Special Collections Instruction -- We can help your students get excited about hands-on research using original materials, become familiar with viewing and using primary sources, get to know the range of materials in our Special Collections holdings.'
        data_visualization: 'Data & Visualization Instruction -- Get hands-on instruction support for your students on making effective data visualizations, data cleaning and analysis, and mapping with GIS.'
        digital_media: 'Digital Media Instruction -- Inspire students and enhance digital literacy and multimedia storytelling skills through podcast, video, and other media making assignments with planning, technology, and Libraries studio spaces support.'
        other: Workshop/Other
      '#required': true
  course_information:
    '#type': webform_wizard_page
    '#title': 'Course Information'
    '#format': fieldset
    '#prev_button_label': '‹ Basic Details'
    '#next_button_label': 'Complete ›'
    fieldset:
      '#type': fieldset
      '#title': 'Course Information Section'
      '#title_display': invisible
      summary_so_far:
        '#type': webform_markup
        '#markup': |-
          <strong>Summary so far</strong>
          <div class="alert alert-info mt-2"><strong>Instruction type:</strong> [webform_submission:values:instruction_type_request]</div>
      your_name:
        '#type': webform_name
        '#title': 'Your name'
        '#required': true
        '#title__access': false
        '#first__title': 'First name'
        '#first__required': true
        '#middle__access': false
        '#last__title': 'Last name'
        '#last__required': true
        '#suffix__access': false
        '#degree__access': false
        '#flexbox': '1'
      unb_email_address:
        '#type': email
        '#title': 'UNB email address'
        '#autocomplete': email
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      course_no:
        '#type': textfield
        '#title': 'Course No.'
        '#description': 'Example: BIOL*1001, KIN*3041'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      course_name:
        '#type': textfield
        '#title': 'Course Name'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      section_information:
        '#type': webform_custom_composite
        '#title': Section
        '#required': true
        '#multiple__sorting': false
        '#multiple__add': false
        '#multiple__add_more_input': false
        '#multiple__add_more_button_label': '⊕ Add another section'
        '#wrapper_attributes':
          class:
            - mb-5
        '#element':
          number_students:
            '#type': textfield
            '#title': 'No. of students'
          course_time:
            '#type': textfield
            '#required': true
            '#title': 'Course time'
            '#description': 'Example: MWF 10-11am'
          date_first:
            '#type': date
            '#required': true
            '#title': 'Date: 1st choice'
            '#description': 'Must be at least 10 days in advance'
            '#date_date_min': '+10 days'
          date_second:
            '#type': date
            '#required': true
            '#title': 'Date: 2nd choice'
            '#description': 'Must be at least 10 days in advance'
            '#date_date_min': '+10 days'
          date_third:
            '#type': date
            '#title': 'Date: 3rd choice'
            '#description': |-
              Must be at least 10 days in advance

              dd/mm/yyyy
            '#date_date_min': '+10 days'
      goals_for_this_session_:
        '#type': textarea
        '#title': 'What are your goals for this session?'
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-5
      students_require_accommodations:
        '#type': radios
        '#title': 'Do you have any students who require special accommodations?'
        '#options':
          'yes': 'Yes -- A library staff member will reach out to you after you submit this form to discuss details.'
          no_unsure: 'No / Not sure -- If you learn of an accommodation need, you can contact us after we have received your initial request.'
        '#required': true
      upload_doc:
        '#type': webform_document_file
        '#title': 'Upload your syllabus and/or assignment description'
        '#multiple': 2
        '#wrapper_attributes':
          class:
            - mb-5
            - mt-4
        '#file_extensions': 'pdf doc docx'
        '#sanitize': true
        '#button': true
        '#button__title': 'Select file<span class="fa-solid fa-paperclip ml-1"></span>'
        '#button__attributes':
          class:
            - btn
            - btn-light
            - border-secondary
      about_assignment:
        '#type': textarea
        '#title': 'Tell us about the assignment students will be working on'
        '#description': 'Briefly describe the assignment, instead of or in addition to uploading it. Tell us where in the assignment process your students will be at the time of the session: whether they have been introduced to the assignment, have chosen topics, or begun researching.'
        '#wrapper_attributes':
          class:
            - mb-5
      associated_research_course_guide:
        '#type': radios
        '#title': 'Is there an associated Research/Course Guide?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
          donotknow: 'Don''t know'
        '#options_display': side_by_side
        '#wrapper_attributes':
          class:
            - webform-options-display-side-by-side
            - mb-4
      develop_library_course_guide:
        '#type': radios
        '#title': 'Would you like us to develop a library course guide?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': side_by_side
        '#states':
          visible:
            ':input[name="associated_research_course_guide"]':
              value: 'no'
        '#wrapper_attributes':
          class:
            - webform-options-display-side-by-side
            - mb-4
      location:
        '#type': radios
        '#title': Location
        '#options':
          hil: 'Harriet Irving Library'
          hwk: 'Hans W. Klohn Commons'
          classroom: Classroom/lab
          online: Online
        '#required': true
        '#wrapper_attributes':
          class:
            - mb-4
      additional_comments:
        '#type': textarea
        '#title': 'Any additional comments?'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
    '#submit__attributes':
      class:
        - mx-1
        - px-3
