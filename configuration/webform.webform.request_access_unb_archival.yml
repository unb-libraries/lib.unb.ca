id: request_access_unb_archival
title: 'Request to Access UNB''s Archival Collections '
description: 'Form used to request photocopies of manuscripts from UNB&#39;s Archival Collections.'
category: ''
elements: |-
  top_markup:
    '#type': processed_text
    '#text': |
      <div class="alert alert-dismissible fade show col-12 bg-dark text-white" role="alert"><button aria-label="Close" class="close" data-dismiss="alert" type="button"><span aria-hidden="true">×</span></button>
      <h2 class="visually-hidden">Note:</h2>
      Your request will be sent to Archives &amp; Special Collections in UNB's Harriet Irving Library</div>
    '#format': library_page_html
  container:
    '#type': container
    '#attributes':
      class:
        - theme-dark
    personal_information:
      '#type': fieldset
      '#title': 'Contact Information'
      name:
        '#type': textfield
        '#title': Name
        '#required': true
        '#required_error': 'Please enter your full name'
      phone:
        '#type': textfield
        '#title': Phone
        '#input_mask': '(999) 999-9999'
        '#required': true
        '#required_error': 'Please provide a phone number with area code'
        '#pattern': '\(\d{3}\)\s\d{3}[\-]\d{4}'
      email:
        '#type': textfield
        '#title': Email
        '#input_mask': '''alias'': ''email'''
        '#required': true
        '#required_error': 'Please provide an email address'
        '#pattern': '^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$'
    manuscript_information:
      '#type': fieldset
      '#title': 'Archives Fonds or Collection Information'
      title_of_collection:
        '#type': textfield
        '#title': 'Title of Fonds or Collection'
        '#required': true
        '#required_error': 'Please enter collection name'
      box_or_item_number_s_:
        '#type': textfield
        '#title': 'Series, Box and/or Item Number(s)'
        '#wrapper_attributes':
          id: series-box
      subject_of_research:
        '#type': textfield
        '#title': 'Subject of Research'
        '#required': true
        '#required_error': 'Please outline your research subject'
      purpose_of_research:
        '#type': webform_select_other
        '#title': 'Purpose of Research'
        '#options':
          article: Article
          thesis: Thesis
          book: Book
          exhibit: Exhibit
        '#required': true
      will_the_material_be_used_for_research_purposes_only_:
        '#type': checkbox
        '#title': 'The material will be used for research purposes only'
        '#required': true
        '#required_error': 'You must agree that you will only use these materials for research'
      i_intend_to_publish:
        '#type': checkbox
        '#title': 'I intend to publish'
    permission_to_publish:
      '#type': fieldset
      '#title': 'Permission to Publish'
      '#states':
        visible-slide:
          ':input[name="i_intend_to_publish"]':
            checked: true
      publishing_project_details:
        '#type': webform_section
        '#title': 'Publishing Project Details'
        '#title_attributes':
          class:
            - h3
        publication_type:
          '#type': textfield
          '#title': 'Publication Type'
          '#description': 'e.g. exhibit, online, magazine, book, etc.'
        how_images_used:
          '#type': textarea
          '#title': 'How will the images be used in the publication?'
          '#description': 'e.g. illustration, title page, etc.'
          '#rows': 2
      image_details:
        '#type': webform_section
        '#title': 'Image Details'
        '#title_attributes':
          class:
            - h3
        description_of_images:
          '#type': textarea
          '#title': 'Description of Images'
          '#rows': 2
        retrieval_numbers:
          '#type': textfield
          '#title': 'Retrieval numbers'
          '#description': 'If not noted in <a href="#series-box" id="series-box">Series, Box and/or Item numbers</a> above'
      citation_information:
        '#type': webform_section
        '#title': 'Citation Information'
        '#title_attributes':
          class:
            - h3
        citation_text:
          '#type': webform_markup
          '#markup': '<p class="mb-1">Citation information for archival materials, including photographs, can be found at our <a href="/guides/archives-and-special-collections#section-5180" rel="noreferrer noopener" target="_blank">Archives and Special Collections Guide</a>. Please give credit to Archives &amp; Special Collections, UNB Libraries.</p>'
      payment_information:
        '#type': webform_section
        '#title': 'Payment Information'
        '#title_attributes':
          class:
            - h3
        payment_info_text:
          '#type': webform_markup
          '#markup': |-
            <p class="mb-1">
            UNB Libraries may choose to waive fees if the publication is for education/non-commercial purposes.&nbsp; Staff will inform you of any charges after processing your request.
            </p>
      terms_and_conditions:
        '#type': webform_section
        '#title': 'Terms and Conditions'
        '#title_attributes':
          class:
            - h3
        markup:
          '#type': webform_markup
          '#markup': |-
            <p paraeid="{e326727c-3302-4c08-a520-f22957d756dc}{234}" paraid="1442693308">To publish, the applicant/publisher is responsible for seeking written permission from the holder of any copyright or other rights. If UNB holds the copyright, please send a request for permission to publish to <a href="mailto:archives@unb.ca" rel="noreferrer noopener" target="_blank">archives@unb.ca</a>. Applicants must abide by the decision conveyed to them.&nbsp;</p>

            <p paraeid="{71d6c0f7-2692-4ca9-b62d-5e0522e3767b}{8}" paraid="47696412">UNB Libraries, in giving its permission to publish, assumes no responsibility for infringement of copyright or publication rights.&nbsp;</p>

            <p paraeid="{71d6c0f7-2692-4ca9-b62d-5e0522e3767b}{14}" paraid="728848265">UNB Libraries retains its own right to publish items from Archives &amp; Special Collections and its right to permit others to do so.&nbsp;&nbsp;</p>

            <p paraeid="{71d6c0f7-2692-4ca9-b62d-5e0522e3767b}{24}" paraid="909631888">Acknowledgement of permission to publish must appear in the published work.&nbsp; A copy of the work must be donated to the Harriet Irving Library by the creator(s).&nbsp;</p>
      agree_to_terms:
        '#type': checkbox
        '#title': ' I have read, understood and agree to the terms and conditions. <small class="font-weight-light text-unb-red">(required)</small>'
        '#required': true
        '#required_error': 'You must agree to our terms and conditions'
    actions:
      '#type': webform_actions
      '#title': 'Submit button(s)'
      '#attributes':
        class:
          - webform-actions-center
      '#submit__label': 'Send Your Request'
      '#reset__label': Cancel
  privacy:
    '#type': webform_markup
    '#wrapper_attributes':
      class:
        - message-privacy
    '#admin_title': 'Privacy Statement'
    '#markup': '<div class="alert alert-info" role="alert"><strong>Privacy: </strong>UNB Libraries will only use the comments you send to improve our website and services. We are not storing any personal information.</div>'
