id: large_format_printing
title: 'Large Format/Poster Printing Request'
description: 'An online submission form for patrons to submit requests for large format printing at the HIL.'
category: ''
elements: |-
  intro_card:
    '#type': webform_markup
    '#markup': |-
      <div class="card mb-3">
      <div class="card-header bg-dark">
      <div class="h6 text-white m-0">Please Note</div>
      </div>

      <div class="card-body">
      <p class="card-text">Large-format printing is available in the Harriet Irving Library Research Commons. The maximum width that can be&nbsp;printed is 36inches, length is unlimited.<br />
      Printing is currently available in two matte formats: draft and presentation (coated), and one glossy (satin) finish. Please&nbsp;allow 72-hours notice for a large-format printing request.</p>

      <ul class="card-text">
      	<li><strong>matte draft paper:</strong> $0.50 per inch by the longest length</li>
      	<li><strong>matte presentation (coated) paper:</strong> $0.75 per inch by longest length</li>
      	<li><strong>satin photo paper:</strong> $1.00 per inch by longest length</li>
      </ul>

      <p class="card-text">It is recommended that you format your image to its final size prior to submitting your request and that you&nbsp;save your file as a pdf for ease of printing.</p>

      <p class="card-text">You will be contacted via email to approve pricing prior to printing and once your print is completed.</p>
      </div>
      </div>
  wrapper:
    '#type': container
    '#attributes':
      class:
        - theme-dark
    personal_information:
      '#type': fieldset
      '#title': 'Personal Information'
      name:
        '#type': textfield
        '#title': Name
        '#prepopulate': true
        '#required': true
      email:
        '#type': email
        '#title': 'UNB Email'
        '#prepopulate': true
        '#required': true
      phone_number:
        '#type': tel
        '#title': 'Phone Number'
        '#required': true
      method_of_payment:
        '#type': radios
        '#title': 'Method of Payment'
        '#options':
          cash_credit: 'Cash/Debit/Credit Card'
          unb_account: 'UNB Account'
        '#required': true
      are_you_the_signing_authority_for_this_unb_account_:
        '#type': radios
        '#title': 'Are you the signing authority for this UNB account?'
        '#options':
          authority_yes: 'Yes'
          authority_no: 'No'
        '#states':
          visible-slide:
            ':input[name="method_of_payment"]':
              value: unb_account
          required:
            ':input[name="method_of_payment"]':
              value: unb_account
        '#attributes':
          aria-label: 'Are you the signing authority for this UNB account? (required)'
      signing_authority_wrapper:
        '#type': fieldset
        '#title': 'Signing Authority Details'
        '#states':
          visible-slide:
            ':input[name="are_you_the_signing_authority_for_this_unb_account_"]':
              value: authority_no
        '#attributes':
          class:
            - px-4
        signing_authority:
          '#type': textfield
          '#title': Name
          '#description': 'The name of the signing authority for this UNB account.'
          '#states':
            required:
              ':input[name="are_you_the_signing_authority_for_this_unb_account_"]':
                value: authority_no
          '#label_attributes':
            aria-label: 'Name of Signing Authority (required)'
        signing_authority_email:
          '#type': email
          '#title': 'UNB Email'
          '#description': 'The email address of the signing authority for this UNB account.'
          '#states':
            required:
              ':input[name="are_you_the_signing_authority_for_this_unb_account_"]':
                value: authority_no
          '#label_attributes':
            aria-label: 'Email address of Signing Authority (required)'
      account_number:
        '#type': textfield
        '#title': 'Account Number'
        '#description': 'Example format: <code>1-234567-89-01</code>'
        '#input_mask': 9-999999-99-99
        '#pattern': '\d-\d{6}-\d{2}-\d{2}'
        '#pattern_error': 'The expected format for the account number is: #-######-##-##'
        '#states':
          visible-slide:
            ':input[name="method_of_payment"]':
              value: unb_account
          required:
            ':input[name="method_of_payment"]':
              value: unb_account
        '#label_attributes':
          aria-label: 'Account Number (required)'
    printing_details:
      '#type': fieldset
      '#title': 'Printing Details'
      when_do_you_need_this_printed_by:
        '#type': datetime
        '#title': 'When do you need this image printed by?'
        '#description': '<small>Please allow 72-hours notice for a large-format printing request. Enter any time request in the <a href="#edit-additional-information">a<em>dditional notes</em></a> field below.</small>'
        '#required': true
        '#date_date_min': '+72 hours'
        '#date_date_format': ''
        '#date_year_range': '+1:2050'
        '#date_time_element': none
      type_of_paper:
        '#type': radios
        '#title': 'What type of paper would you like your image printed on?'
        '#options':
          matte_draft: 'matte draft paper: <span class="badge text-secondary">$0.50 per inch by the longest length (not recommended for poster presentations)</span>'
          'matte_presentation ': 'matte presentation (coated) paper: <span class="badge text-secondary">$0.75 per inch by longest length</span>'
          satin_photo: 'satin photo paper: <span class="badge text-secondary">$1.00 per inch by longest length</span>'
        '#options_display': buttons_vertical
        '#required': true
      is_your_file_sized_for_printing:
        '#type': radios
        '#title': 'Is your file ready for printing and within the maximum 36" width?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
          not_sure: 'I''m not sure'
        '#required': true
      dimensions_of_your_file:
        '#type': textfield
        '#title': 'What are the dimensions of your file (in inches)?'
      upload_your_file_:
        '#type': managed_file
        '#title': 'Upload your file '
        '#description': '<strong>Please note:</strong> it is recommended that you format your image to its final&nbsp;size prior to submitting your request and that you save your file as a PDF for ease of printing.'
        '#required': true
        '#max_filesize': '20'
        '#file_extensions': 'pdf tiff jpg'
        '#sanitize': true
        '#button': true
        '#button__title': 'Select file<span class="fa-solid fa-paperclip ml-1"></span>'
        '#button__attributes':
          class:
            - btn
            - btn-primary
      additional_information:
        '#type': textarea
        '#title': 'Please provide any additional notes or information'
        '#rows': 3
    actions:
      '#type': webform_actions
      '#title': 'Submit button(s)'
      '#attributes':
        class:
          - webform-actions-center
      '#submit__label': 'Submit Request'
      '#reset__label': Cancel
