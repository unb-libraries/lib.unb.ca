id: report_oer_resource
title: 'Report Open Educational Resources (OER) Adoption'
description: 'Webform that allows faculty let us know that they&#39;ve adopted an OER.'
category: ''
elements: |-
  container:
    '#type': container
    '#attributes':
      class:
        - theme-dark
    personal_information:
      '#type': fieldset
      '#title': 'Personal information'
      name:
        '#type': textfield
        '#title': Name
        '#required': true
        '#default_value': '[current-user:field_first_name] [current-user:field_last_name]'
      faculty_discipline:
        '#type': textfield
        '#title': Faculty
        '#required': true
      email:
        '#type': textfield
        '#title': Email
        '#input_mask': '''alias'': ''email'''
        '#required': true
        '#pattern': '^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$'
        '#default_value': '[current-user:mail]'
      home_campus:
        '#type': radios
        '#title': 'Home campus'
        '#options':
          fredericton: Fredericton
          saint_john: 'Saint John'
          moncton: Moncton
        '#options_display': side_by_side
    project_information:
      '#type': fieldset
      '#title': 'Project Information'
      course_code:
        '#type': textfield
        '#title': 'Course Code'
      semester_course_offered:
        '#type': checkboxes
        '#title': 'What semester(s) is your course offered in?'
        '#options':
          f: Fall
          w: Winter
          s: Summer
        '#options_display': side_by_side
        '#required': true
      how_many_students:
        '#type': textfield
        '#title': 'How many students are enrolled in this course?'
      do_you_use:
        '#type': checkboxes
        '#title': 'Do you use'
        '#options':
          oer: OER
          course_reserves: 'Course Reserves'
        '#options_display': side_by_side
      oer_link:
        '#type': webform_link
        '#title': 'OER link'
        '#states':
          visible-slide:
            ':input[name="do_you_use[oer]"]':
              checked: true
        '#title__access': false
        '#url__title': 'Please share the OER URL'
        '#url__required': true
      materials_cost_associated:
        '#type': radios
        '#title': 'Does your course have any other materials that have a cost associated?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': side_by_side
      previous_course_cost:
        '#type': textfield
        '#title': 'What did your previous textbook or course material (if relevant) cost?'
        '#states':
          visible-slide:
            ':input[name="materials_cost_associated"]':
              value: 'yes'
      learn_more_about_your_experience:
        '#type': radios
        '#title': 'May we reach out to you to learn more about your experience using these resources? '
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#options_display': side_by_side
