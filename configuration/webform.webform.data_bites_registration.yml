id: data_bites_registration
title: 'Data Bites'
description: 'BugzID:&nbsp;<a href="https://support.lib.unb.ca/default.asp?21591">21591</a> webform.'
category: ''
elements: |-
  container:
    '#type': container
    '#attributes':
      class:
        - theme-dark
    email_us:
      '#type': fieldset
      '#title': Registration
      required:
        '#type': webform_markup
        '#markup': 'Data Bites sessions are 30 minutes, every Thursday from 12:00-12:30 PM in the Harriet Irving Research Commons Innovation Hub (HIL 316). Visit <a href="https://lib.unb.ca/rdm/rdm-workshops">https://lib.unb.ca/rdm/rdm-workshops</a> for details.'
      name:
        '#type': textfield
        '#title': 'Your Name'
        '#autocomplete': name
        '#required': true
        '#default_value': '[current-user:display-name]'
      email:
        '#type': email
        '#title': 'Your Email'
        '#autocomplete': email
        '#required': true
        '#pattern': '^(\D)+(\w)*((\.(\w)+)?)+@(\D)+(\w)*((\.(\D)+(\w)*)+)?(\.)[a-z]{2,}$'
        '#default_value': '[current-user:mail]'
      which_sessions:
        '#type': checkboxes
        '#title': 'Which sessions do you plan to attend? '
        '#options':
          file_naming: 'File naming best practices for research data <time class="text-info" datetime="2025-10-2">(October 2)</time>'
          choosing_file: 'Choosing file formats for research data <time class="text-info" datetime="2025-10-9">(October 9)</time>'
          creating_readme: 'Creating README files for research data <time class="text-info" datetime="2025-10-16">(October 16)</time>'
          creating_simplified: 'Creating a simplified Data Management Plan (DMP) <time class="text-info" datetime="2025-10-23">(October 23)</time>'
          help: 'Help! My Qualitative Data is a Hot Mess: Data Cleanup in Excel <time class="text-info" datetime="2025-11-06">(November 6)</time>'
          choosing_file_repeat: 'Choosing file formats for research data <span class="text-unb-red">(Repeat Session)</span> <time class="text-info" datetime="2025-11-13">(November 13)</time>'
          file_naming_repeat: 'File naming best practices for research data <span class="text-unb-red">(Repeat Session) <time class="text-info" datetime="2025-11-20">(November 20)</time>'
          depositing: 'Depositing research data in UNB Dataverse <time class="text-info" datetime="2025-11-2">(November 27)</time>'
          optimizing: 'Optimizing directory structures for research data <time class="text-info" datetime="2025-12-4">(December 4)</time>'
        '#required': true
        '#required_error': 'Please select at least 1 session to continue'
    actions:
      '#type': webform_actions
      '#title': 'Submit button(s)'
      '#attributes':
        class:
          - webform-actions-center
      '#submit__label': 'Register '
      '#submit__attributes':
        class:
          - px-4
          - mx-2
      '#reset__label': 'Clear form'
  privacy:
    '#type': webform_markup
    '#wrapper_attributes':
      class:
        - message-privacy
        - d-none
    '#admin_title': 'Privacy Statement (hidden)'
    '#markup': '<div class="alert alert-info" role="alert"><strong>Privacy: </strong> UNB Libraries will only use the comments you send to improve our website and services. We are not storing any personal information.</div>'
