classification.add_form:
  route_name: entity.taxonomy_term.add_form
  route_parameters:
    taxonomy_vocabulary: retention_classification
  title: "Add classification"
  appears_on:
    - view.retention_classifications.page_1

schedule.add_form:
  route_name: entity.schedule.add_form
  title: "Add schedule"
  appears_on:
    - entity.schedule.collection
    - view.retention_schedules.page
    - view.retention_classifications.page_1

schedule.download:
  route_name: view.retention_schedules.data_export
  title: "Download"
  options:
    attributes:
      class:
        - "link-no-icon"
  appears_on:
    - view.retention_schedules.page
